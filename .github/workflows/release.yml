name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check tag matches build.zig.zon version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.zig.zon version $version"
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    # zig fetch compiles the build runner on a cold cache.
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Version comes from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Hash the archive consumers will fetch
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          hash=$(zig fetch "$url")
          zig_version=$(sed -n 's/^ *\.minimum_zig_version = "\(.*\)",$/\1/p' build.zig.zon)

          {
            echo "Add to a project using Zig $zig_version or newer:"
            echo
            echo '```sh'
            echo "zig fetch --save $url"
            echo '```'
            echo
            echo "Package hash: \`$hash\`"
            echo
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
